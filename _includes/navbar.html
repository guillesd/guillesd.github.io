<style>
  /* Klisé's #mode floats left with position:relative left:8px and z-index:1.
     Pad the title left so it clears that icon. */
  .navbar .site-title {
    font-family: inherit;
    font-weight: 600;
    font-size: 1.05rem;
    text-decoration: none;
    color: inherit;
    padding-left: 45px;
    white-space: nowrap;
  }
  .navbar .site-title:hover { opacity: 0.7; }

  /* Klisé ships `#mode` with `top: 6px` which sits below the inline title and
     nav links — pull it back up so all three baselines line up. */
  .navbar .menu a#mode { top: 0; }

  /* Hide the blue focus outline on click, but keep it for keyboard navigation
     (Tab) so the page stays accessible. */
  .navbar a:focus { outline: none; }
  .navbar a:focus-visible {
    outline: 2px solid currentColor;
    outline-offset: 2px;
    border-radius: 2px;
  }

  @media screen and (max-width: 768px) {
    .navbar .site-title {
      /* mobile mode-icon sits at left:10px top:12px in the fixed 50px bar */
      padding-left: 45px;
      font-size: 0.95rem;
    }
  }
</style>
